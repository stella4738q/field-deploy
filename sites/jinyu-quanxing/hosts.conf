# ══════════════════════════════════════════════════════════════════════
#  主機清單
#  格式：name  ssh_host  port  user  role  internal_ip  readonly
#  role：ems / data-collection（兼 Samba storage）/ database-server
#  慣例：.101=ems-1、.102=ems-2、.103=data-collection、.105=database-server
#  readonly=yes：標記為「只能看」的機器（例如運轉中的既有設備），
#                所有寫入類腳本會硬性拒絕執行
# ══════════════════════════════════════════════════════════════════════

# 晉瑜全興新案場（部署目標）— 現場確認連線資訊後，取消註解並填入實際值
# 直連內網時 ssh_host 填內網 IP、port 填 22；走 router port forwarding 則填外部 IP + 轉發 port
#qx-ems-1              192.168.100.101  22   myuser  ems                192.168.100.101  no
#qx-ems-2              192.168.100.102  22   myuser  ems                192.168.100.102  no
#qx-data-collection    192.168.100.103  22   myuser  data-collection    192.168.100.103  no
#qx-database-server    192.168.100.105  22   oem     database-server    192.168.100.105  no
