# ══════════════════════════════════════════════════════════════════════
#  主機清單
#  格式：name  ssh_host  port  user  role  internal_ip  readonly
#  role：ems / nas / mongo
#  readonly=yes：標記為「只能看」的機器（例如運轉中的既有設備），
#                所有寫入類腳本會硬性拒絕執行
# ══════════════════════════════════════════════════════════════════════

# 晉瑜全興新案場（部署目標）— 現場確認連線資訊後，取消註解並填入實際值
# 直連內網時 ssh_host 填內網 IP、port 填 22；走 router port forwarding 則填外部 IP + 轉發 port
#jy-ems1   192.168.100.101  22   myuser  ems    192.168.100.101  no
#jy-ems2   192.168.100.102  22   myuser  ems    192.168.100.102  no
#jy-nas    192.168.100.103  22   myuser  nas    192.168.100.103  no
#jy-mongo  192.168.100.105  22   oem     mongo  192.168.100.105  no
