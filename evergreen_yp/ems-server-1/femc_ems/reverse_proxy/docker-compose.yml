services:
  reverse-proxy:
    image: nginx:stable-alpine
    container_name: reverse_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./configs:/configs
      - ./log:/var/log/nginx
    ports:
      - "80:80"
    restart: always
    networks:
      - femc_ems_network

networks:
  femc_ems_network:
    external: true

