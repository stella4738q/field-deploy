openapi: 3.0.0


info:
  version: 1.0.0
  title: EMS Dashboard API
  description: EMS Dashboard API


servers:
  - url: https://localhost/api/v1


tags:
  - name: ACS
    description: Access Control System
  - name: FAS
    description: Fire Alarm System
  - name: PCS
    description: Process Control System
  - name: ESS
    description: Energy Storage System Cabinet
  - name: BID
    description: Bid Management


components:
  ####################
  # Common data models
  ####################

  schemas:
    # Schema for error response body
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message

  ####################
  # Common parameters
  ####################
  parameters:
    PageLimit:
      name: limit
      in: query
      description: Limits the number of items on a page
      schema:
        type: integer
    PageOffset:
      name: page
      in: query
      description: Specifies the page number of the artists to be displayed
      schema:
        type: integer

  #######################
  # Common request bodies
  #######################
  requestBodies:
    NewItem:
      description: A JSON object containing item data
      required: true
      content:
        application/json:
          schema:
            type: object
          examples:
            tshirt:
              $ref: '#/components/examples/tshirt'

  ####################
  # Security
  ####################
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic

  ####################
  # Common responses
  ####################
  responses:
    NotFound:
      description: The specified resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Invalid request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
    5XXError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string

    Success:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              data:
                type: object
                example:
                  x:
                    - a
                    - b
                  y:
                    - 1
                    - 2

    Success_array_object:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              data:
                type: array
                items:
                    type: object

    Success_message:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string



  ######################################
  # Common examples of input/output data
  ######################################
  examples:
    tshirt:
      summary: Sample T-shirt data
      value:
        # Example value starts here
        id: 17
        name: T-shirt
        description: 100% cotton shirt
        categories: [clothes]



security:
  - BasicAuth: []



