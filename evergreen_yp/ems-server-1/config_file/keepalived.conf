global_defs {
  router_id keepalived_node1
}

vrrp_script chk_haproxy {
  script "/usr/local/sbin/haproxy_check.sh"
  interval 2
  weight -5
  fall 2
  rise 2
}

vrrp_instance VI_1 {

  state MASTER
    interface eno1
    virtual_router_id 101
    priority 101
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass 91014968
    }
    virtual_ipaddress {
        192.168.100.100
    }

  track_script {
    chk_haproxy
  }
}