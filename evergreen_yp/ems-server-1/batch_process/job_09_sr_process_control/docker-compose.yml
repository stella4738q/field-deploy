version: "3.8"

services:
  server:
    image: "batch-scheduler:v1.0.27"
    container_name: "job-09-sr-process-control"
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    network_mode: host
    environment:
      - TZ=Asia/Taipei
    command: ["python", "main.py"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./logs:/app/logs
      - ./config.ini:/app/config.ini
      - /mnt/nas/storage:/app/data
      - /home/femc/project/share_folder:/app/share_folder
