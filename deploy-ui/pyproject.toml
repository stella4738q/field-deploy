[project]
name = "femc-field-deploy-ui"
version = "0.1.0"
description = "FEMC 案場圖形化部署工具：選主機 × 選軟體 → 自動部署 + 即時 terminal"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "paramiko>=3.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
